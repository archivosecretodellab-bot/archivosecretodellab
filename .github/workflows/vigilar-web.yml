name: Vigilar la web
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node _tools/vigilar.js
        env:
          COMPARAR_BIOS: '1'
